  <style>
    .blog-hero {

    .blog-hero-inner {
      max-width: 800px;

    .blog-eyebrow {

      color: var(--accent, #6c63ff);

    .blog-hero h1 {

    }

    .blog-grid {
      max-width: 800px;
      margin: 0 auto;
      padding: 60px 24px 120px;

    }
    .blog-card {
      border-bottom: 1px solid var(--border, rgba(255,255,255,0.08));
      padding-bottom: 48px;
    }
    .blog-card:last-child {

    }
    .blog-meta {
      font-size: 13px;
      color: var(--muted, #8888a8);
      margin-bottom: 12px;
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .blog-tag {
      background: rgba(108,99,255,0.12);
      color: var(--accent, #6c63ff);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .blog-card h2 {
      font-size: clamp(20px, 3vw, 26px);
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 12px;
      color: var(--fg, #f0f0f5);
    }
    .blog-card h2 a {
      color: inherit;
      text-decoration: none;
    }
    .blog-card h2 a:hover {
      color: var(--accent, #6c63ff);
    }
    .blog-card p {
      color: var(--muted, #8888a8);
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 20px;
    }
    .blog-readmore {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent, #6c63ff);
      text-decoration: none;
    }
    .blog-readmore:hover {
      text-decoration: underline;
    }
    .blog-empty {
      text-align: center;
      padding: 80px 24px;
      color: var(--muted, #8888a8);
    }
    .blog-empty h2 {
      font-size: 24px;
      margin-bottom: 12px;
      color: var(--fg, #f0f0f5);
    }
    @media (max-width: 600px) {
      .blog-hero { padding: 100px 0 40px; }
      .blog-grid { padding: 40px 16px 80px; }
